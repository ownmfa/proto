services:
  go_openapi:
    build: ./go
    command: sh -c "cd go && make"
    volumes:
      - .:/proto

  python:
    build: ./python
    command: sh -c "cd python && make"
    volumes:
      - .:/proto

  dart:
    build: ./dart
    command: sh -c "cd dart && make"
    volumes:
      - .:/proto

  ruby:
    build: ./ruby
    command: sh -c "cd ruby && make"
    volumes:
      - .:/proto

  cpp:
    build: ./cpp
    command: sh -c "cd cpp && make"
    volumes:
      - .:/proto

  php:
    build: ./php
    command: sh -c "cd php && make"
    volumes:
      - .:/proto
